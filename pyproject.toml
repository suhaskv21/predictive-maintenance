[project]
name = "predictive-maintenance"
version = "0.1.0"
description = "Predictive maintenance ML system: machine failure risk from sensor readings (AI4I 2020)."
readme = "README.md"
authors = [
    { name = "Suhas", email = "Suhas.Kashetty.Venkateshkumar@aumovio.com" }
]
requires-python = ">=3.12"
dependencies = [
    "joblib==1.5.3",
    "lightgbm==4.6.0",
    "polars==1.33.1",
    "scikit-learn==1.8.0",
    "xgboost==2.1.4",
]

# Not in `dependencies`: the wheel installed in the browser must name only Pyodide-bundled packages
# (ADR 0012). Install with `uv sync --extra streamlit` to run the Streamlit stub.
[project.optional-dependencies]
streamlit = ["streamlit>=1.65.0"]

# The browser build (ADR 0009) runs in marimo's Pyodide, which ships fixed library versions. The
# pins above and these constraints equal that Pyodide's, so native and browser runs agree.
[tool.uv]
constraint-dependencies = [
    "numpy==2.4.3",
    "scipy==1.17.1",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "altair>=6.3.0",
    "marimo==0.25.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.coverage.run]
source = ["src/predictive_maintenance"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The entry notebook is exempt from the linter (ADR 0012): marimo owns its cell layout.
extend-exclude = ["notebooks", "marimo_app.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "D1"]
ignore = ["D104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true
